spring.application.name=FraudTransactionApp

server.port=${SERVER_PORT}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER}


spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}


# HikariCP
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME}
spring.datasource.hikari.pool-name=${DB_POOL_NAME}

# Actuator
management.endpoints.web.exposure.include=${ACTUATOR_EXPOSED_ENDPOINTS}
management.endpoint.health.show-details=${ACTUATOR_HEALTH_SHOW_DETAILS}
management.endpoint.health.show-components=${ACTUATOR_HEALTH_SHOW_COMPONENTS}
management.health.defaults.enabled=${ACTUATOR_HEALTH_DEFAULTS_ENABLED}

# Logging
logging.file.name=${LOG_FILE_NAME}
logging.file.path=${LOG_FILE_PATH}
logging.logback.rollingpolicy.max-file-size=${LOG_MAX_FILE_SIZE}
logging.logback.rollingpolicy.max-history=${LOG_MAX_HISTORY}
logging.logback.rollingpolicy.total-size-cap=${LOG_TOTAL_SIZE_CAP}
logging.pattern.file=${LOG_PATTERN_FILE}

# Tracing / Zipkin
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY}
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT}
logging.pattern.level=${LOG_PATTERN_LEVEL}
management.tracing.enabled=${TRACING_ENABLED}


#SIKKARI

sikkari.api.key=${SIKKARI_API_KEY}
sikkari.base.url=${SIKKARI_URL}

# Fraud Engine Thresholds
fraud.threshold.block=${FRAUD_THRESHOLD_BLOCK}
fraud.threshold.review=${FRAUD_THRESHOLD_REVIEW}

# Velocity Limits
fraud.velocity.card.1min=${FRAUD_VELOCITY_CARD_1MIN}
fraud.velocity.card.1hour=${FRAUD_VELOCITY_CARD_1HOUR}
fraud.velocity.card.24hour=${FRAUD_VELOCITY_CARD_24HOUR}

fraud.velocity.ip.1min=${FRAUD_VELOCITY_IP_1MIN}
fraud.velocity.ip.1hour=${FRAUD_VELOCITY_IP_1HOUR}

# Risk Thresholds
fraud.risk.ip.threshold=${FRAUD_RISK_IP_THRESHOLD}
fraud.risk.merchant.threshold=${FRAUD_RISK_MERCHANT_THRESHOLD}

spring.profiles.active=dev

spring.jackson.default-property-inclusion=non_null

logging.level.com.interswitch.fraudtransactionapp.client=INFO

spring.jackson.deserialization.fail-on-unknown-properties=false

debug=true
logging.level.org.flywaydb=DEBUG